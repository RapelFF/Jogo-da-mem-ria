<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogo da Memória</title>

<style>
  /* ===========================================================
     CSS — aparência e animações.
     As variáveis de cor (--fundo, --painel, --glow, --verso-a,
     --verso-b, --frente) são trocadas pelo JavaScript conforme a
     skin equipada: a interface inteira muda de clima junto.
     =========================================================== */
  :root {
    --fundo: #17313B;
    --painel: #1F3D48;
    --glow: #2F5D62;
    --destaque: #F2B705;
    --texto: #EAF2F0;
    --acerto: #7FB069;
    --acerto-cpu: #C46A5B;
    --tinta: #17313B;

    --verso-a: #2F5D62;
    --verso-b: #24494D;
    --frente: #F1E3C8;
  }

  * { box-sizing: border-box; }

  html { -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 56px 16px 32px;
    background-color: var(--fundo);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow-x: hidden;
    transition: background-color 0.6s ease;
  }

  /* Evita o zoom por toque duplo e o atraso de 300ms nos botões */
  button { touch-action: manipulation; font-family: inherit; }

  /* Manchas de luz derivando atrás de tudo */
  body::before {
    content: "";
    position: fixed;
    inset: -20%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(40% 40% at 25% 30%, var(--glow), transparent 70%),
      radial-gradient(35% 35% at 80% 75%, var(--glow), transparent 70%);
    opacity: 0.55;
    animation: deriva 20s ease-in-out infinite alternate;
  }
  @keyframes deriva {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(4%, -3%) scale(1.15); }
  }

  /* Símbolos flutuando no fundo */
  .fundo-flutuante {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .fundo-flutuante span {
    position: absolute;
    bottom: -12vh;
    opacity: 0.1;
    animation: subir linear infinite;
  }
  @keyframes subir {
    from { transform: translateY(0) rotate(0deg); }
    to   { transform: translateY(-125vh) rotate(360deg); }
  }

  /* Modo leve: ligado sozinho em aparelhos mais modestos (poucos núcleos/pouca memória) */
  .leve body::before { animation: none; }
  .leve .fundo-flutuante { display: none; }

  #fx { position: fixed; inset: 0; z-index: 20; pointer-events: none; }

  .tela {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    width: 100%;
    max-width: 560px;
  }
  .tela:not(.oculta) { animation: entrar 0.4s ease-out; }
  .oculta { display: none !important; }

  @keyframes entrar {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes subir-suave {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes pop {
    0%   { transform: scale(0.6); }
    60%  { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 2.8rem;
    font-weight: 400;
    margin: 0;
    letter-spacing: 1px;
    text-align: center;
  }
  h1 span {
    display: inline-block;
    animation: letra 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.4) backwards;
    animation-delay: calc(var(--i) * 45ms);
    transition: transform 0.2s;
  }
  h1 span:hover { transform: translateY(-8px) rotate(-8deg); }
  @keyframes letra {
    from { opacity: 0; transform: translateY(-36px) rotate(-14deg); }
    to   { opacity: 1; transform: none; }
  }

  h2, h3 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; margin: 0; }
  h2 { font-size: 1.5rem; text-align: center; }
  h3 { font-size: 1.25rem; }
  h4 { margin: 6px 0 0; font-size: 0.95rem; font-weight: 600; opacity: 0.85; align-self: flex-start; }
  p { margin: 0; }

  .subtitulo { margin-top: -8px; font-size: 0.95rem; opacity: 0.75; text-align: center; }

  /* Pílulas de informação */
  .chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    font-size: 0.95rem;
    background: var(--painel);
    border: 2px solid transparent;
    border-radius: 999px;
    transition: border-color 0.25s, transform 0.25s, background 0.25s;
  }
  .chip b { color: var(--destaque); font-weight: 600; }
  .chip.ativo { border-color: var(--destaque); transform: scale(1.07); }
  .chip.combo {
    background: var(--destaque);
    color: var(--fundo);
    font-weight: 700;
    animation: pop 0.35s ease-out;
  }
  .moeda-icone { display: inline-block; animation: girar 3s linear infinite; }
  @keyframes girar {
    0%   { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }

  .som {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 25;
    width: 46px;
    height: 46px;
    font-size: 1.1rem;
    border: none;
    border-radius: 50%;
    background: var(--painel);
    color: var(--texto);
    cursor: pointer;
  }
  .som:focus-visible { outline: 3px solid var(--destaque); outline-offset: 2px; }

  /* Botões grandes dos menus (altura mínima de 56px: fáceis de tocar) */
  .opcoes { display: flex; flex-direction: column; gap: 12px; width: min(300px, 100%); }

  .opcao {
    position: relative;
    min-height: 56px;
    padding: 14px;
    font-size: 1.05rem;
    color: var(--texto);
    background: var(--painel);
    border: 2px solid transparent;
    border-radius: 14px;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
  }
  .tela:not(.oculta) .opcao {
    animation: subir-suave 0.45s ease-out backwards;
    animation-delay: calc(var(--i, 0) * 80ms + 150ms);
  }
  .opcao:active { transform: scale(0.98); }
  .opcao:focus-visible { outline: 3px solid var(--destaque); outline-offset: 3px; }
  .opcao small { display: block; margin-top: 4px; font-size: 0.8rem; opacity: 0.7; }

  .aviso-badge {
    position: absolute;
    top: -8px;
    right: -6px;
    min-width: 24px;
    height: 24px;
    padding: 0 7px;
    font-size: 0.8rem;
    font-weight: 700;
    line-height: 24px;
    color: var(--fundo);
    background: var(--destaque);
    border-radius: 999px;
    animation: pop 0.4s ease-out;
  }
  .aviso-badge:empty { display: none; }

  .botao {
    min-height: 48px;
    padding: 12px 26px;
    font-size: 1rem;
    color: var(--fundo);
    background: var(--destaque);
    border: 2px solid var(--destaque);
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.2s;
  }
  .botao:active { transform: scale(0.96); }
  .botao:disabled { opacity: 0.45; cursor: default; }
  .botao.secundario { color: var(--texto); background: transparent; border-color: rgba(255,255,255,0.25); }
  .botao:focus-visible { outline: 3px solid var(--texto); outline-offset: 3px; }

  .link-voltar {
    min-height: 44px;
    padding: 10px 16px;
    background: none;
    border: none;
    color: var(--texto);
    opacity: 0.75;
    font-size: 0.95rem;
    cursor: pointer;
    text-decoration: underline;
  }

  /* Só aplica o "hover" em aparelhos com mouse (no celular ele ficaria preso depois do toque) */
  @media (hover: hover) {
    .som:hover { transform: scale(1.12); }
    .opcao:hover { border-color: var(--destaque); transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 22px rgba(0,0,0,0.3); }
    .botao:hover:not(:disabled) { transform: translateY(-2px); }
    .link-voltar:hover { opacity: 1; }
    .skin:hover { transform: translateY(-4px); }
    .carta:not(.virada):not(.encontrada):hover .carta-interna { transform: translateY(-4px) rotate(-3deg); }
  }

  /* ---------- Loja ---------- */
  .lista-skins {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
    gap: 12px;
    width: 100%;
  }
  .skin {
    --rar: #9DB4B0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 12px 6px;
    color: var(--texto);
    background: var(--painel);
    border: 2px solid transparent;
    border-top: 4px solid var(--rar);
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.2s, outline-color 0.2s;
    outline: 2px solid transparent;
    outline-offset: 2px;
  }
  .skin.anim { animation: subir-suave 0.4s ease-out backwards; animation-delay: calc(var(--i, 0) * 60ms); }
  .skin.foco { outline-color: var(--destaque); }
  .skin:focus-visible { outline: 3px solid var(--destaque); }
  .skin .amostra {
    width: 50px;
    height: 50px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    color: rgba(255,255,255,0.45);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.12);
  }
  .skin .nome { font-size: 0.85rem; }
  .skin .raridade { font-size: 0.7rem; font-weight: 700; color: var(--rar); }
  .skin .estado { font-size: 0.72rem; opacity: 0.85; }
  .skin.equipada .estado { color: var(--acerto); opacity: 1; font-weight: 700; }
  .skin.sem-moedas { opacity: 0.6; }
  .skin[data-raridade="lendaria"] { animation: brilho-lendario 2.4s ease-in-out infinite; }
  .skin[data-raridade="epica"] { box-shadow: 0 0 14px -4px var(--rar); }
  @keyframes brilho-lendario {
    0%, 100% { box-shadow: 0 0 6px -2px var(--rar); }
    50%      { box-shadow: 0 0 18px 0 var(--rar); }
  }

  .detalhe-skin {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    padding: 14px 16px;
    background: var(--painel);
    border-radius: 16px;
  }
  .detalhe-skin .previa { display: flex; gap: 8px; }
  .detalhe-skin .mini {
    width: 52px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    border-radius: 8px;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.12);
  }
  .detalhe-skin .info { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; flex: 1; }
  .detalhe-skin .info p { font-size: 0.85rem; opacity: 0.85; }
  .mensagem-loja { min-height: 22px; font-size: 0.95rem; color: var(--destaque); text-align: center; }

  /* ---------- Desafios ---------- */
  .lista-desafios { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .desafio {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px 12px;
    align-items: center;
    padding: 12px 14px;
    background: var(--painel);
    border-radius: 14px;
  }
  .desafio .texto { font-size: 0.95rem; }
  .desafio .barra-mini {
    grid-column: 1;
    height: 6px;
    background: rgba(255,255,255,0.12);
    border-radius: 999px;
    overflow: hidden;
  }
  .desafio .barra-mini i { display: block; height: 100%; background: linear-gradient(90deg, var(--acerto), var(--destaque)); border-radius: inherit; }
  .desafio .num { grid-column: 1; font-size: 0.75rem; opacity: 0.7; }
  .desafio .botao { grid-column: 2; grid-row: 1 / span 3; min-height: 44px; padding: 8px 16px; font-size: 0.9rem; }
  .desafio.feito { opacity: 0.6; }

  /* ---------- Tela do jogo ---------- */
  .linha-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 10px; }

  .barra {
    width: min(360px, 100%);
    height: 8px;
    background: var(--painel);
    border-radius: 999px;
    overflow: hidden;
  }
  .barra i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--acerto), var(--destaque));
    transition: width 0.5s cubic-bezier(0.3, 1.4, 0.5, 1);
  }

  .vez {
    min-height: 36px;
    padding: 7px 20px;
    font-size: 1rem;
    color: var(--destaque);
    background: var(--painel);
    border-radius: 999px;
    transition: background 0.3s, color 0.3s;
  }
  .vez:empty { visibility: hidden; }
  .vez.cpu { background: var(--acerto-cpu); color: #fff; animation: respirar 1.2s ease-in-out infinite; }
  @keyframes respirar {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }

  /* O tabuleiro calcula sozinho o tamanho da carta: nunca passa de 84px
     e diminui se a tela for estreita (cabe em qualquer celular).
     Tabuleiro grande vira 4 colunas em telas pequenas, com cartas maiores. */
  .tabuleiro {
    --cols: 4;
    --gap: 12px;
    --tam: min(84px, calc((100vw - 32px - (var(--cols) - 1) * var(--gap)) / var(--cols)));
    display: grid;
    grid-template-columns: repeat(var(--cols), var(--tam));
    gap: var(--gap);
    justify-content: center;
  }
  .tabuleiro.grande { --cols: 6; }
  @media (max-width: 520px) {
    .tabuleiro { --gap: 10px; }
    .tabuleiro.grande { --cols: 4; }
    h1 { font-size: 2.2rem; }
  }
  .tabuleiro.bloqueado .carta { cursor: progress; }

  /* ---------- A carta, com animação de virar em 3D ----------
     Animações "de momento" (cair, pular, tremer, festa) usam classes
     que o JavaScript coloca e tira — assim nunca repetem sozinhas. */
  .carta {
    width: var(--tam);
    height: var(--tam);
    padding: 0;
    border: none;
    background: none;
    perspective: 600px;
    cursor: pointer;
  }
  .carta:focus-visible { outline: 3px solid var(--destaque); outline-offset: 3px; border-radius: 10px; }

  .carta-interna {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.45s ease;
  }
  .carta.virada .carta-interna,
  .carta.encontrada .carta-interna { transform: rotateY(180deg); }
  .carta.virada, .carta.encontrada { cursor: default; }

  .verso, .frente {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .verso {
    background: linear-gradient(135deg, var(--verso-a), var(--verso-b));
    color: rgba(255,255,255,0.35);
    font-size: calc(var(--tam) * 0.3);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.12), 0 4px 10px rgba(0,0,0,0.25);
  }
  .frente {
    background: var(--frente);
    color: var(--tinta);
    font-size: calc(var(--tam) * 0.42);
    transform: rotateY(180deg);
  }
  .carta.encontrada .frente { background: var(--acerto); }
  .carta.encontrada-cpu .frente { background: var(--acerto-cpu); }

  .carta.nova {
    animation: distribuir 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards;
    animation-delay: calc(var(--i) * 45ms);
  }
  @keyframes distribuir {
    from { opacity: 0; transform: translateY(-50px) scale(0.6) rotate(-14deg); }
    to   { opacity: 1; transform: none; }
  }
  .carta.pulo { animation: pulo 0.55s ease-out; }
  @keyframes pulo {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .carta.tremer { animation: tremer 0.4s ease-in-out; }
  @keyframes tremer {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .carta.festa { animation: onda 0.7s ease-in-out; animation-delay: calc(var(--i) * 40ms); }
  @keyframes onda {
    0%, 100% { transform: translateY(0); }
    40%      { transform: translateY(-16px) scale(1.1); }
  }

  /* ---------- Textos flutuantes ---------- */
  .flutuante {
    position: fixed;
    z-index: 30;
    transform: translate(-50%, 0);
    pointer-events: none;
    font-weight: 700;
    font-size: 1.2rem;
    color: var(--destaque);
    text-shadow: 0 2px 6px rgba(0,0,0,0.55);
    white-space: nowrap;
    animation: flutuar 1s ease-out forwards;
  }
  .flutuante.cpu { color: #FFB3A7; }
  @keyframes flutuar {
    0%   { opacity: 0; transform: translate(-50%, 0) scale(0.6); }
    15%  { opacity: 1; transform: translate(-50%, -14px) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -70px) scale(1); }
  }

  /* ---------- Painel de resultado ---------- */
  .resultado {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 20px 26px;
    width: min(360px, 100%);
    text-align: center;
    background: var(--painel);
    border-radius: 16px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.35);
    animation: pop-grande 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.3);
  }
  @keyframes pop-grande {
    from { opacity: 0; transform: translateY(24px) scale(0.85); }
    to   { opacity: 1; transform: none; }
  }
  .resultado .ganho { color: var(--destaque); font-weight: 700; font-size: 1.15rem; }
  .resultado .total { font-size: 0.9rem; opacity: 0.8; }
  .resultado .missao { color: var(--acerto); font-size: 0.9rem; }
  .resultado .botoes-linha { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }

  /* ---------- Espaço reservado para anúncio (só aparece se ANUNCIOS.ativo = true) ---------- */
  .anuncio {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    background: rgba(8, 12, 16, 0.92);
    text-align: center;
  }
  .anuncio .caixa-anuncio {
    width: min(320px, 100%);
    height: 250px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px dashed rgba(255,255,255,0.3);
    border-radius: 12px;
    font-size: 0.9rem;
    opacity: 0.8;
  }

  /* Quem pediu menos movimento no sistema recebe o jogo sem animações. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<body>

  <div class="fundo-flutuante" id="fundo-flutuante" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <button class="som" id="botao-som" type="button" aria-label="Ligar ou desligar o som">🔊</button>

  <!-- ===================== MENU ===================== -->
  <div class="tela" id="tela-menu">
    <h1 id="titulo-menu">Jogo da Memória</h1>
    <p class="subtitulo">Encontre todos os pares</p>
    <p class="chip"><span class="moeda-icone">🪙</span> Moedas: <b id="menu-moedas">0</b></p>
    <div class="opcoes">
      <button class="opcao" id="botao-solo" type="button" style="--i:0">🎮 Jogar solo</button>
      <button class="opcao" id="botao-cpu" type="button" style="--i:1">🤖 Contra a máquina</button>
      <button class="opcao" id="botao-desafios" type="button" style="--i:2">🎯 Desafios <span class="aviso-badge" id="badge-desafios"></span></button>
      <button class="opcao" id="botao-loja" type="button" style="--i:3">🛍️ Loja de cartas</button>
    </div>
  </div>

  <!-- ================ ESCOLHA DO NÍVEL ================ -->
  <div class="tela oculta" id="tela-nivel">
    <h2>Escolha o nível</h2>
    <div class="opcoes">
      <button class="opcao" data-nivel="facil" type="button" style="--i:0">
        🌱 Fácil <small>A máquina esquece e erra bastante</small>
      </button>
      <button class="opcao" data-nivel="media" type="button" style="--i:1">
        ⚡ Média <small>Memoriza parte das cartas</small>
      </button>
      <button class="opcao" data-nivel="dificil" type="button" style="--i:2">
        🔥 Difícil <small>Aproveita quase tudo que viu</small>
      </button>
    </div>
    <button class="link-voltar" id="voltar-menu" type="button">Voltar</button>
  </div>

  <!-- ================ TAMANHO DO TABULEIRO ================ -->
  <div class="tela oculta" id="tela-tamanho">
    <h2>Tamanho do tabuleiro</h2>
    <div class="opcoes">
      <button class="opcao" data-tamanho="pequeno" type="button" style="--i:0">
        🟢 Pequeno <small>6 pares · moedas ×0,75</small>
      </button>
      <button class="opcao" data-tamanho="medio" type="button" style="--i:1">
        🟡 Médio <small>8 pares · moedas ×1</small>
      </button>
      <button class="opcao" data-tamanho="grande" type="button" style="--i:2">

// ---------------------------------------------------------------
// 2) SALVAMENTO NO NAVEGADOR (localStorage)
//    Tudo que é lido passa por uma "limpeza": se o dado salvo estiver
//    estranho (apagado, corrompido, mexido), voltamos ao valor padrão
//    em vez de quebrar o jogo.
// ---------------------------------------------------------------

function ler(chave, padrao) {
  try {
    const valor = localStorage.getItem(chave);
    return valor === null ? padrao : JSON.parse(valor);
  } catch (erro) {
    return padrao;
  }
}

function salvar(chave, valor) {
  try {
    localStorage.setItem(chave, JSON.stringify(valor));
  } catch (erro) {
    /* sem salvamento: o jogo continua funcionando */
  }
}

function lerNumero(chave, padrao) {
  const valor = ler(chave, padrao);
  return Number.isFinite(valor) && valor >= 0 ? Math.floor(valor) : padrao;
}

function novoEstado() {
  return { partidas: 0, vitorias: 0, pares: 0, combo: 0, melhorRapido: null, cpu: { facil: 0, media: 0, dificil: 0 } };
}

function normalizarEstado(e) {
  const base = novoEstado();
  if (!e || typeof e !== "object") return base;
  ["partidas", "vitorias", "pares", "combo"].forEach(function (k) {
    if (Number.isFinite(e[k]) && e[k] >= 0) base[k] = Math.floor(e[k]);
  });
  if (Number.isFinite(e.melhorRapido) && e.melhorRapido >= 0) base.melhorRapido = e.melhorRapido;
  if (e.cpu && typeof e.cpu === "object") {
    ["facil", "media", "dificil"].forEach(function (k) {
      if (Number.isFinite(e.cpu[k]) && e.cpu[k] >= 0) base.cpu[k] = Math.floor(e.cpu[k]);
    });
  }
  return base;
}

function normalizarResgatados(r) {
  const limpo = {};
  if (r && typeof r === "object") {
    Object.keys(r).forEach(function (k) { if (r[k] === true) limpo[k] = true; });
  }
  return limpo;
}

let moedas = 0;

  const compradas = ler("memoria-skins", ["classico"]);
  skinsCompradas = Array.isArray(compradas)

  if (!skinsCompradas.includes("classico")) skinsCompradas.push("classico");

  const equipada = ler("memoria-skin", "classico");
  skinAtualId = skinsCompradas.includes(equipada) ? equipada : "classico";

  const tempos = ler("memoria-melhores", {});
  melhoresTempos = tempos && typeof tempos === "object" ? tempos : {};
  const pts = ler("memoria-melhores-pontos", {});
  melhoresPontos = pts && typeof pts === "object" ? pts : {};

  somLigado = ler("memoria-som", true) !== false;

  const d = ler("memoria-dia", null);
  dia = d && typeof d === "object" && typeof d.data === "string"
    ? { data: d.data, estado: normalizarEstado(d.estado), resgatados: normalizarResgatados(d.resgatados) }
    : null;

  const o = ler("memoria-obj", null);
  obj = { estado: normalizarEstado(o && o.estado), resgatados: normalizarResgatados(o && o.resgatados) };

  garantirDia();
}

// Se mudou o dia, os desafios diários recomeçam do zero.
function hojeTexto() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function garantirDia() {
  const hoje = hojeTexto();
  if (!dia || dia.data !== hoje) {
    dia = { data: hoje, estado: novoEstado(), resgatados: {} };

  }
}

// Modo leve e "menos movimento"
const menosMovimento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const fatorParticulas = leve ? 0.45 : 1;

let audioCtx = null;

function garantirAudio() {
  if (!audioCtx) {
    const Contexto = window.AudioContext || window.webkitAudioContext;
    if (Contexto) audioCtx = new Contexto();
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}

function tom(frequencia, inicio, duracao, tipo, volume) {
  if (!somLigado || !audioCtx) return;
  const t0 = audioCtx.currentTime + inicio;
  const oscilador = audioCtx.createOscillator();
  const ganho = audioCtx.createGain();

  oscilador.type = tipo || "sine";
  oscilador.frequency.value = frequencia;

  ganho.gain.setValueAtTime(0.0001, t0);
  ganho.gain.exponentialRampToValueAtTime(volume || 0.15, t0 + 0.01);
  ganho.gain.exponentialRampToValueAtTime(0.0001, t0 + duracao);

  oscilador.connect(ganho);
  ganho.connect(audioCtx.destination);
  oscilador.start(t0);
  oscilador.stop(t0 + duracao + 0.05);
}

const sons = {
  virar:   function () { tom(520, 0, 0.08, "triangle", 0.12); },

  erro:    function () { tom(220, 0, 0.18, "sawtooth", 0.07); tom(165, 0.12, 0.22, "sawtooth", 0.07); },
  vitoria: function () { [523, 659, 784, 1047].forEach(function (f, i) { tom(f, i * 0.14, 0.26, "sine", 0.15); }); },

// ---------------------------------------------------------------
// 6) EFEITOS VISUAIS: partículas, confete, textos flutuantes
// ---------------------------------------------------------------

const fx = document.getElementById("fx");
const fxCtx = fx.getContext("2d");
let particulas = [];
let fxAtivo = false;

function ajustarFx() {
  fx.width = window.innerWidth;
  fx.height = window.innerHeight;
}
window.addEventListener("resize", ajustarFx);
ajustarFx();

function adicionarParticula(p) {
  particulas.push(p);
  if (!fxAtivo) {
    fxAtivo = true;
    requestAnimationFrame(loopFx);
  }
}

function explodir(x, y, cores, quantidade) {
  if (menosMovimento) return;
  const total = Math.max(4, Math.round(quantidade * fatorParticulas));
  for (let i = 0; i < total; i++) {
    const angulo = Math.random() * Math.PI * 2;
    const velocidade = 2 + Math.random() * 4.5;
    adicionarParticula({
      x: x, y: y,
      vx: Math.cos(angulo) * velocidade,
      vy: Math.sin(angulo) * velocidade - 1.5,
      queda: 0.12, vida: 1, decai: 0.025,
      tam: 3 + Math.random() * 4,
      cor: cores[Math.floor(Math.random() * cores.length)],
      forma: "bola"
    });
  }
}

function confete(cores) {
  if (menosMovimento) return;
  const total = Math.round(140 * fatorParticulas);
  for (let i = 0; i < total; i++) {
    adicionarParticula({
      x: Math.random() * fx.width,
      y: -20 - Math.random() * fx.height * 0.4,
      vx: (Math.random() - 0.5) * 3,
      vy: 2 + Math.random() * 3.5,
      queda: 0.04, vida: 1, decai: 0.004,
      tam: 6 + Math.random() * 6,
      cor: cores[Math.floor(Math.random() * cores.length)],
      giro: Math.random() * 6,
      vgiro: (Math.random() - 0.5) * 0.3,
      forma: "papel"
    });
  }
}

function loopFx() {
  fxCtx.clearRect(0, 0, fx.width, fx.height);
  particulas = particulas.filter(function (p) { return p.vida > 0 && p.y < fx.height + 30; });

  particulas.forEach(function (p) {
    p.vy += p.queda;
    p.x += p.vx;
    p.y += p.vy;
    p.vida -= p.decai;

    fxCtx.globalAlpha = Math.max(0, Math.min(1, p.vida));
    fxCtx.fillStyle = p.cor;

    if (p.forma === "papel") {
      p.giro += p.vgiro;
      fxCtx.save();
      fxCtx.translate(p.x, p.y);
      fxCtx.rotate(p.giro);
      fxCtx.fillRect(-p.tam / 2, -p.tam / 4, p.tam, p.tam / 2);
      fxCtx.restore();
    } else {
      fxCtx.beginPath();
      fxCtx.arc(p.x, p.y, p.tam * Math.max(0.3, p.vida), 0, Math.PI * 2);
      fxCtx.fill();
    }
  });
  fxCtx.globalAlpha = 1;

  if (particulas.length > 0) {
    requestAnimationFrame(loopFx);
  } else {
    fxAtivo = false;
    fxCtx.clearRect(0, 0, fx.width, fx.height);
  }
}

function limparEfeitos() {
  particulas = [];
}

function centroDe(elemento) {
  const caixa = elemento.getBoundingClientRect();
  return { x: caixa.left + caixa.width / 2, y: caixa.top + caixa.height / 2 };
}

function flutuar(texto, referencia, classe) {
  const caixa = referencia.getBoundingClientRect();
  const balao = document.createElement("div");
  balao.className = "flutuante " + (classe || "");
  balao.textContent = texto;
  balao.style.left = (caixa.left + caixa.width / 2) + "px";
  balao.style.top = caixa.top + "px";
  document.body.appendChild(balao);
  setTimeout(function () { balao.remove(); }, 1100);
}

function animarNumero(elemento, de, para, duracao) {
  if (menosMovimento || de === para) {
    elemento.textContent = para;
    return;
  }
  const inicio = performance.now();
  function passo(agora) {
    const k = Math.min(1, (agora - inicio) / duracao);
    elemento.textContent = Math.round(de + (para - de) * k);
    if (k < 1) requestAnimationFrame(passo);
  }
  requestAnimationFrame(passo);
}

function coresDaSkin() {
  const skin = skinAtual();
  return [skin.versoA, skin.versoB, "#F2B705", "#FFFFFF"];
}

function criarFundoFlutuante() {
  if (leve) return;
  const area = document.getElementById("fundo-flutuante");
  for (let i = 0; i < 12; i++) {
    const item = document.createElement("span");
    item.textContent = simbolos[i % simbolos.length];
    item.style.left = (Math.random() * 100) + "%";
    item.style.fontSize = (22 + Math.random() * 34) + "px";
    item.style.animationDuration = (16 + Math.random() * 16) + "s";
    item.style.animationDelay = "-" + (Math.random() * 28) + "s";
    area.appendChild(item);
  }
}

function montarTitulo() {
  const titulo = document.getElementById("titulo-menu");
  const letras = Array.from(titulo.textContent);
  titulo.innerHTML = letras.map(function (letra, i) {
    return '<span style="--i:' + i + '" aria-hidden="true">' + (letra === " " ? "&nbsp;" : letra) + "</span>";
  }).join("");
  titulo.setAttribute("aria-label", "Jogo da Memória");
}

function mostrarTela(tela) {

function embaralhar(lista) {
  for (let i = lista.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [lista[i], lista[j]] = [lista[j], lista[i]];
  }
  return lista;
}

function formatarTempo(ms) {
  const segundos = Math.floor(ms / 1000);
  const mm = String(Math.floor(segundos / 60)).padStart(2, "0");
  const ss = String(segundos % 60).padStart(2, "0");
  return mm + ":" + ss;
}

function iniciarCronometro() {
  inicioTempo = Date.now();
  relogio = setInterval(function () {
    elTempo.textContent = formatarTempo(Date.now() - inicioTempo);
  }, 250);
}

function pararCronometro() {
  if (relogio !== null) clearInterval(relogio);
  relogio = null;
}

// Cada combinação de modo + nível + tamanho tem seu próprio recorde.
function chaveDoRecorde() {
  return (modo === "solo" ? "solo" : "cpu-" + nivelId) + "-" + tamanhoId;
}

function atualizarMelhorTempo() {

  elMelhor.textContent = melhor ? formatarTempo(melhor) : "--:--";

// ---------------------------------------------------------------
// 8) DESAFIOS E OBJETIVOS
//    Um único jeito de medir progresso serve para os dois.
//    "estado" guarda o que você fez (partidas, vitórias, pares, maior
//    combo, melhor tempo, vitórias contra a máquina por nível).
// ---------------------------------------------------------------

// Sorteio com semente: a mesma data sempre dá os mesmos 3 desafios.
function semente(texto) {
  let h = 0;
  for (let i = 0; i < texto.length; i++) h = (h * 31 + texto.charCodeAt(i)) >>> 0;
  return h;
}

function aleatorioComSemente(s) {
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function escolherDiarios(data) {
  const sorteio = aleatorioComSemente(semente(data));
  const lista = poolDiarios.slice();
  for (let i = lista.length - 1; i > 0; i--) {
    const j = Math.floor(sorteio() * (i + 1));
    [lista[i], lista[j]] = [lista[j], lista[i]];
  }
  // Três desafios de tipos diferentes, pra não repetir a mesma ideia.
  const escolhidos = [];
  const tipos = {};
  lista.forEach(function (m) {
    if (escolhidos.length < 3 && !tipos[m.tipo]) {
      tipos[m.tipo] = true;
      escolhidos.push(m);
    }
  });
  return escolhidos;
}

// Quanto precisa pra completar. "rapido" e "vencerCpu" são do tipo "fez ou não fez".
function metaEfetiva(m) {
  return (m.tipo === "rapido" || m.tipo === "vencerCpu") ? 1 : m.meta;
}

function progressoDe(m, est) {
  switch (m.tipo) {
    case "vitorias":  return est.vitorias;
    case "partidas":  return est.partidas;
    case "pares":     return est.pares;
    case "combo":     return est.combo;
    case "rapido":    return (est.melhorRapido !== null && est.melhorRapido <= m.meta) ? 1 : 0;
    case "vencerCpu": return est.cpu[m.nivel] > 0 ? 1 : 0;
  }
  return 0;
}

// Soma o resultado de uma partida ao estado (do dia ou permanente).
function aplicarPartida(est, r) {
  est.partidas++;
  if (r.venceu) est.vitorias++;
  est.pares += r.pares;
  if (r.combo > est.combo) est.combo = r.combo;
  if (r.venceu && r.totalPares >= 8) {
    if (est.melhorRapido === null || r.tempoSeg < est.melhorRapido) est.melhorRapido = r.tempoSeg;
  }
  if (r.venceu && r.modo === "cpu") est.cpu[r.nivel]++;
}

function todosOsDesafios() {
  garantirDia();
  const lista = [];
  escolherDiarios(dia.data).forEach(function (m) { lista.push({ m: m, origem: "dia" }); });
  objetivos.forEach(function (m) { lista.push({ m: m, origem: "obj" }); });
  return lista;
}

function estadoDe(origem) { return origem === "dia" ? dia.estado : obj.estado; }
function resgatadosDe(origem) { return origem === "dia" ? dia.resgatados : obj.resgatados; }

function estaCompleto(item) {
  return progressoDe(item.m, estadoDe(item.origem)) >= metaEfetiva(item.m);
}

function contarResgataveis() {
  return todosOsDesafios().filter(function (item) {
    return estaCompleto(item) && !resgatadosDe(item.origem)[item.m.id];
  }).length;
}

// Registra o fim de uma partida e devolve os desafios que acabaram de ficar completos.
function registrarDesafios(r) {
  garantirDia();
  const antes = todosOsDesafios().filter(estaCompleto).map(function (i) { return i.m.id; });

  aplicarPartida(dia.estado, r);
  aplicarPartida(obj.estado, r);
  salvar("memoria-dia", dia);
  salvar("memoria-obj", obj);

  return todosOsDesafios().filter(function (item) {
    return estaCompleto(item) && !antes.includes(item.m.id);
  }).map(function (item) { return item.m.texto; });
}

function linhaDeDesafio(item) {
  const m = item.m;
  const meta = metaEfetiva(m);
  const prog = Math.min(progressoDe(m, estadoDe(item.origem)), meta);
  const completo = prog >= meta;
  const resgatado = !!resgatadosDe(item.origem)[m.id];

  const caixa = document.createElement("div");
  caixa.className = "desafio" + (resgatado ? " feito" : "");

  const textoNum = meta === 1 ? (completo ? "Completo" : "Não concluído") : prog + " / " + meta;
  caixa.innerHTML =
    '<span class="texto">' + m.texto + '</span>' +
    '<span class="barra-mini"><i style="width:' + Math.round(prog / meta * 100) + '%"></i></span>' +
    '<span class="num">' + textoNum + '</span>';

  const botao = document.createElement("button");
  botao.type = "button";
  botao.className = "botao";
  if (resgatado) {
    botao.textContent = "Resgatado ✓";
    botao.disabled = true;
  } else if (completo) {
    botao.textContent = "Resgatar +" + m.premio + " 🪙";
    botao.addEventListener("click", function () { resgatar(item, botao); });
  } else {
    botao.textContent = "+" + m.premio + " 🪙";
    botao.disabled = true;
  }
  caixa.appendChild(botao);
  return caixa;
}

function desenharDesafios() {
  carregarSalvos();
  desafiosMoedas.textContent = moedas;
  listaDiarios.innerHTML = "";
  listaObjetivos.innerHTML = "";
  todosOsDesafios().forEach(function (item) {
    (item.origem === "dia" ? listaDiarios : listaObjetivos).appendChild(linhaDeDesafio(item));
  });
}

/* Resgatar: a recompensa só sai UMA vez. O "resgatado" é marcado e salvo
   ANTES de somar as moedas, e os dados são relidos do navegador antes de tudo. */
function resgatar(item, botao) {
  carregarSalvos();
  const reg = resgatadosDe(item.origem);
  if (reg[item.m.id]) return;              // já resgatado
  if (!estaCompleto(item)) return;         // ainda não completou

  const centro = centroDe(botao);
  reg[item.m.id] = true;
  salvar(item.origem === "dia" ? "memoria-dia" : "memoria-obj", item.origem === "dia" ? dia : obj);

  const antes = moedas;
  moedas += item.m.premio;
  salvar("memoria-moedas", moedas);

  sons.moeda();
  explodir(centro.x, centro.y, ["#F2B705", "#FFFFFF", "#7FB069"], 28);
  desenharDesafios();
  animarNumero(desafiosMoedas, antes, moedas, 600);
}

// ---------------------------------------------------------------
// 9) SKINS E LOJA
// ---------------------------------------------------------------

function skinAtual() {
  return skins.find(function (s) { return s.id === skinAtualId; }) || skins[0];
}

function aplicarSkin() {
  const skin = skinAtual();
  const raiz = document.documentElement.style;
  raiz.setProperty("--verso-a", skin.versoA);
  raiz.setProperty("--verso-b", skin.versoB);
  raiz.setProperty("--frente", skin.frente);
  raiz.setProperty("--fundo", skin.fundo);
  raiz.setProperty("--painel", skin.painel);
  raiz.setProperty("--glow", skin.glow);
}

// Estado de cada item da loja: equipada, comprada, à venda (dá pra pagar) ou sem moedas.
function estadoDaSkin(skin) {
  if (skinsCompradas.includes(skin.id)) return skin.id === skinAtualId ? "equipada" : "comprada";
  return moedas >= skin.custo ? "venda" : "sem-moedas";
}

function rotuloDoEstado(skin, estado) {
  if (estado === "equipada") return "✓ Equipada";
  if (estado === "comprada") return "Comprada";
  if (estado === "venda") return "À venda · 🪙 " + skin.custo;
  return "🔒 🪙 " + skin.custo;
}

function desenharLoja(mensagem, animar) {
  lojaMoedas.textContent = moedas;
  mensagemLoja.textContent = mensagem || "";
  listaSkins.innerHTML = "";

  skins.forEach(function (skin, indice) {
    const estado = estadoDaSkin(skin);
    const rar = raridades[skin.raridade];

    const botao = document.createElement("button");
    botao.type = "button";
    botao.className = "skin " + estado + (skin.id === skinEmFoco ? " foco" : "") + (animar ? " anim" : "");
    botao.dataset.raridade = skin.raridade;
    botao.style.setProperty("--rar", rar.cor);
    botao.style.setProperty("--i", indice);
    botao.innerHTML =
      '<span class="amostra" style="background:linear-gradient(135deg,' + skin.versoA + ',' + skin.versoB + ')">' + skin.padrao + '</span>' +
      '<span class="nome">' + skin.nome + '</span>' +
      '<span class="raridade">' + rar.nome + '</span>' +
      '<span class="estado">' + rotuloDoEstado(skin, estado) + '</span>';

    // Tocar só seleciona (mostra os detalhes). Comprar exige o botão do painel,
    // então um toque acidental nunca gasta moedas.
    botao.addEventListener("click", function () {
      skinEmFoco = skin.id;
      desenharLoja("", false);
    });
    listaSkins.appendChild(botao);
  });

  desenharDetalheDaSkin();
}

function desenharDetalheDaSkin() {
  const skin = skins.find(function (s) { return s.id === skinEmFoco; }) || skins[0];
  const estado = estadoDaSkin(skin);
  const rar = raridades[skin.raridade];

  let rotuloBotao, desabilitado = false;
  if (estado === "equipada")      { rotuloBotao = "Equipada"; desabilitado = true; }
  else if (estado === "comprada") { rotuloBotao = "Equipar"; }
  else if (estado === "venda")    { rotuloBotao = "Comprar por 🪙 " + skin.custo; }
  else                            { rotuloBotao = "Faltam " + (skin.custo - moedas) + " moedas"; desabilitado = true; }

  detalheSkin.innerHTML =
    '<div class="previa">' +
      '<span class="mini" style="background:linear-gradient(135deg,' + skin.versoA + ',' + skin.versoB + ');color:rgba(255,255,255,.45)">' + skin.padrao + '</span>' +
      '<span class="mini" style="background:' + skin.frente + ';color:#17313B">🍋</span>' +
    '</div>' +
    '<div class="info">' +
      '<h3>' + skin.nome + '</h3>' +
      '<p style="color:' + rar.cor + ';font-weight:700;opacity:1">' + rar.nome + '</p>' +
      '<p>' + rotuloDoEstado(skin, estado) + '</p>' +
      '<button class="botao" id="acao-skin" type="button"' + (desabilitado ? " disabled" : "") + '>' + rotuloBotao + '</button>' +
    '</div>';

  document.getElementById("acao-skin").addEventListener("click", function (evento) {
    acaoDaSkin(skin, evento.currentTarget);
  });
}

function acaoDaSkin(skin, botao) {
  carregarSalvos();   // dados frescos: evita comprar duas vezes em abas diferentes
  const centro = centroDe(botao);

  if (skinsCompradas.includes(skin.id)) {
    skinAtualId = skin.id;
    salvar("memoria-skin", skinAtualId);
    aplicarSkin();
    desenharLoja("Skin " + skin.nome + " equipada.", false);
    return;
  }
  if (moedas < skin.custo) {
    sons.erro();
    desenharLoja("Faltam " + (skin.custo - moedas) + " moedas pra liberar " + skin.nome + ".", false);
    return;
  }

  const moedasAntes = moedas;
  moedas -= skin.custo;
  skinsCompradas.push(skin.id);
  skinAtualId = skin.id;   // compra já equipa
  salvar("memoria-moedas", moedas);
  salvar("memoria-skins", skinsCompradas);
  salvar("memoria-skin", skinAtualId);
  aplicarSkin();
  sons.moeda();
  explodir(centro.x, centro.y, [skin.versoA, skin.versoB, "#F2B705", "#FFFFFF"], 40);
  desenharLoja("Você comprou e equipou a skin " + skin.nome + "!", false);
  animarNumero(lojaMoedas, moedasAntes, moedas, 600);
}

// ---------------------------------------------------------------
// 10) ANÚNCIOS (preparação — DESLIGADO por padrão)
//     Aqui só existe o "encaixe". Nenhum anúncio real é carregado.
//     Regras já respeitadas pelo código:
//       • só aparece ENTRE partidas (nos botões do painel de resultado)
//       • nunca durante as jogadas (jogoEmAndamento precisa ser false)
//       • só a cada N partidas, nunca em toda partida
//     Antes de ligar de verdade: teste bem o jogo, escolha a plataforma
//     (ex.: AdSense na web, AdMob no app) e leia as regras dela. Elas
//     costumam exigir aviso de consentimento e política de privacidade.
// ---------------------------------------------------------------

const ANUNCIOS = {
  ativo: false,            // mude para true só quando for testar o espaço
  aCadaPartidas: 3,        // 1 anúncio a cada 3 partidas concluídas
  segundosParaContinuar: 3
};
let partidasDesdeAnuncio = 0;
let anuncioAberto = false;

const elAnuncio = document.getElementById("anuncio");
const botaoFecharAnuncio = document.getElementById("botao-fechar-anuncio");

function passarPeloAnuncio(continuar) {
  if (!ANUNCIOS.ativo || jogoEmAndamento || anuncioAberto || partidasDesdeAnuncio < ANUNCIOS.aCadaPartidas) {
    continuar();
    return;
  }
  partidasDesdeAnuncio = 0;
  anuncioAberto = true;
  elAnuncio.classList.remove("oculta");

  // >>> Aqui entraria a chamada do SDK da plataforma de anúncios. <<<

  let restante = ANUNCIOS.segundosParaContinuar;
  botaoFecharAnuncio.disabled = true;
  botaoFecharAnuncio.textContent = "Continuar (" + restante + ")";
  const contagem = setInterval(function () {
    restante--;
    if (restante > 0) {
      botaoFecharAnuncio.textContent = "Continuar (" + restante + ")";
    } else {
      clearInterval(contagem);
      botaoFecharAnuncio.disabled = false;
      botaoFecharAnuncio.textContent = "Continuar";
    }
  }, 1000);

  botaoFecharAnuncio.onclick = function () {
    elAnuncio.classList.add("oculta");
    anuncioAberto = false;
    continuar();
  };
}

// ---------------------------------------------------------------
// 11) COMEÇAR E SAIR DE UMA PARTIDA
// ---------------------------------------------------------------

function iniciarJogo() {
  partida++;                 // invalida qualquer timer da partida anterior
  const id = partida;
  pararCronometro();
  limparEfeitos();
  inicioTempo = null;

  cartas = [];
  cartasViradas = [];
  travado = true;            // trava os cliques enquanto as cartas "caem"
  jogoEmAndamento = true;
  partidaFinalizada = false;
  jogadas = 0;
  erros = 0;
  paresEncontrados = 0;
  pontos = { voce: 0, cpu: 0 };
  vezDaCpu = false;
  serie = 0;
  melhorSerie = 0;
  bonusCombo = 0;
  memoria = {};
  ordemDaMemoria = [];
  tabuleiro.innerHTML = "";
  tabuleiro.className = "tabuleiro " + tamanhoId;
  resultado.classList.add("oculta");
  elTempo.textContent = "00:00";
  atualizarMelhorTempo();

  tituloJogo.textContent = (modo === "solo" ? "Solo" : "Contra a máquina · " + nivel.nome) + " · " + tamanho.nome;

  const skin = skinAtual();
  const baralho = embaralhar(simbolos.slice(0, tamanho.pares).concat(simbolos.slice(0, tamanho.pares)));

  baralho.forEach(function (simbolo, posicao) {
    const carta = document.createElement("button");
    carta.type = "button";
    carta.className = "carta nova";
    carta.style.setProperty("--i", posicao);
    carta.setAttribute("aria-label", "Carta");
    carta.dataset.simbolo = simbolo;
    carta.dataset.posicao = posicao;
    carta.innerHTML =
      '<span class="carta-interna">' +
        '<span class="verso">' + skin.padrao + '</span>' +
        '<span class="frente">' + simbolo + '</span>' +
      '</span>';
    carta.addEventListener("click", function () { cliqueDoJogador(carta); });
    carta.addEventListener("animationend", function () { carta.classList.remove("nova"); }, { once: true });
    tabuleiro.appendChild(carta);
    cartas.push(carta);
  });

  atualizarPlacar();
  mostrarTela(telaJogo);

  // Libera os cliques quando a última carta termina de cair.
  setTimeout(function () {
    if (id === partida) travado = false;
  }, menosMovimento ? 0 : cartas.length * 45 + 600);
}

function sairDoJogo() {
  partida++;
  jogoEmAndamento = false;
  travado = false;
  pararCronometro();
  limparEfeitos();
  mostrarMenu();
}

function atualizarPlacar() {
  barra.style.width = (paresEncontrados / tamanho.pares * 100) + "%";

  const combo = serie >= 2 ? '<p class="chip combo">🔥 Combo x' + serie + '</p>' : "";

  if (modo === "solo") {
    placar.innerHTML =
      '<p class="chip">Jogadas <b>' + jogadas + '</b></p>' +
      '<p class="chip">Pares <b>' + paresEncontrados + '</b> de ' + tamanho.pares + '</p>' + combo;
    aviso.textContent = "";
    aviso.className = "vez";
  } else {
    placar.innerHTML =
      '<p class="chip' + (vezDaCpu ? "" : " ativo") + '">Você <b>' + pontos.voce + '</b></p>' +
      '<p class="chip' + (vezDaCpu ? " ativo" : "") + '">Máquina <b>' + pontos.cpu + '</b></p>' + combo;
    aviso.textContent = vezDaCpu ? "Vez da máquina..." : "Sua vez";
    aviso.className = "vez" + (vezDaCpu ? " cpu" : "");
  }
  tabuleiro.classList.toggle("bloqueado", vezDaCpu);
}

// ---------------------------------------------------------------
// 12) VIRAR CARTAS E CONFERIR PARES
// ---------------------------------------------------------------

function cliqueDoJogador(carta) {
  if (travado || vezDaCpu || partidaFinalizada) return;
  abrirCarta(carta);
}

/* Serve para o jogador e para a máquina. As travas abaixo impedem
   que uma carta seja virada duas vezes ou que uma terceira carta
   abra enquanto o par anterior ainda está sendo conferido. */
function abrirCarta(carta) {
  if (!carta || partidaFinalizada) return;
  if (cartasViradas.length >= 2) return;
  if (cartasViradas.includes(carta)) return;
  if (carta.classList.contains("virada")) return;
  if (carta.classList.contains("encontrada")) return;

  if (inicioTempo === null) iniciarCronometro();

  carta.classList.add("virada");
  sons.virar();
  cartasViradas.push(carta);
  memorizar(carta);

  if (cartasViradas.length === 2) {
    jogadas++;
    verificarPar();
  }
}

function efeitosDePar(a, b) {
  const cores = coresDaSkin();
  [a, b].forEach(function (c) {
    const centro = centroDe(c);
    explodir(centro.x, centro.y, cores, 16);
  });

  let texto;
  if (serie >= 2) {
    texto = (vezDaCpu ? "Máquina " : "") + "Combo x" + serie + "!";
    sons.combo(serie);
  } else {
    texto = vezDaCpu ? "Máquina!" : "Par!";
  }
  flutuar(texto, b, vezDaCpu ? "cpu" : "");
}

function verificarPar() {
  travado = true;
  const id = partida;
  const primeira = cartasViradas[0];
  const segunda = cartasViradas[1];
  const acertou = primeira.dataset.simbolo === segunda.dataset.simbolo;

  if (!acertou && !menosMovimento) {
    setTimeout(function () {
      if (id !== partida) return;
      primeira.classList.add("tremer");
      segunda.classList.add("tremer");
    }, 480);
  }

  setTimeout(function () {
    if (id !== partida) return;

    if (acertou) {
      sons.acerto();
      serie++;
      if (!vezDaCpu) {
        if (serie > melhorSerie) melhorSerie = serie;
        if (serie >= 2) bonusCombo++;
      }

      [primeira, segunda].forEach(function (c) {
        c.classList.add("encontrada");
        if (vezDaCpu) c.classList.add("encontrada-cpu");
        c.classList.add("pulo");
        setTimeout(function () { c.classList.remove("pulo"); }, 600);
        esquecer(c);
      });
      efeitosDePar(primeira, segunda);

      paresEncontrados++;
      if (modo === "cpu") pontos[vezDaCpu ? "cpu" : "voce"]++;
    } else {
      sons.erro();
      serie = 0;
      if (!vezDaCpu) erros++;
      primeira.classList.remove("virada", "tremer");
      segunda.classList.remove("virada", "tremer");
    }

    cartasViradas = [];
    travado = false;

    if (paresEncontrados === tamanho.pares) {
      atualizarPlacar();
      finalizarPartida();
      return;
    }

    if (modo === "cpu") {
      if (!acertou) vezDaCpu = !vezDaCpu;
      atualizarPlacar();
      if (vezDaCpu) setTimeout(function () { turnoDaCpu(id); }, 600);
    } else {
      atualizarPlacar();
    }
  }, acertou ? 600 : 1000);
}

// ---------------------------------------------------------------
// 13) FIM DE PARTIDA: tempo, pontuação, recordes, moedas e desafios
// ---------------------------------------------------------------

function finalizarPartida() {
  if (partidaFinalizada) return;   // garante que moedas e desafios são contados uma vez só
  partidaFinalizada = true;
  jogoEmAndamento = false;

  const id = partida;
  pararCronometro();
  carregarSalvos();
  const tempo = Date.now() - inicioTempo;
  const tempoSeg = Math.round(tempo / 1000);
  elTempo.textContent = formatarTempo(tempo);

  const paresSeus = modo === "solo" ? tamanho.pares : pontos.voce;
  const venceu = modo === "solo" ? true : pontos.voce > pontos.cpu;
  const empate = modo === "cpu" && pontos.voce === pontos.cpu;

  // Pontuação: 100 por par seu, bônus por rapidez (quanto menos tempo, mais pontos) e -15 por erro.
  const tempoAlvo = tamanho.pares * 10;
  const pontuacao = Math.max(0, paresSeus * 100 + Math.max(0, tempoAlvo - tempoSeg) * 5 - erros * 15);

  const linhas = [];
  let titulo, ganho;

  if (modo === "solo") {
    titulo = "🎉 Você venceu!";
    const bonusTempo = tempoSeg < tempoAlvo * 0.55 ? 6 : (tempoSeg < tempoAlvo * 0.95 ? 3 : 0);
    ganho = Math.round((4 + bonusTempo) * tamanho.fator);
    linhas.push("Tempo: " + formatarTempo(tempo) + " · Jogadas: " + jogadas);
  } else {
    titulo = venceu ? "🎉 Você venceu!" : (empate ? "🤝 Empate!" : "🤖 A máquina venceu");
    ganho = pontos.voce + (venceu ? Math.round(nivel.bonus * tamanho.fator) : 0);
    linhas.push("Placar: " + pontos.voce + " a " + pontos.cpu + " · Tempo: " + formatarTempo(tempo));
  }

  linhas.push("⭐ Pontuação: " + pontuacao);

  if (bonusCombo > 0) {
    ganho += bonusCombo;
    linhas.push("🔥 Maior combo: x" + melhorSerie + " (+" + bonusCombo + " moedas)");
  }

  // Recordes só valem se você venceu.
  if (venceu) {
    const chave = chaveDoRecorde();
    const tempoAnterior = melhoresTempos[chave];
    if (!tempoAnterior || tempo < tempoAnterior) {
      melhoresTempos[chave] = tempo;
      salvar("memoria-melhores", melhoresTempos);
      linhas.push("🏆 Novo recorde de tempo!");
      atualizarMelhorTempo();
    }
    const pontosAnterior = melhoresPontos[chave];
    if (!pontosAnterior || pontuacao > pontosAnterior) {
      melhoresPontos[chave] = pontuacao;
      salvar("memoria-melhores-pontos", melhoresPontos);
      linhas.push("🌟 Novo recorde de pontos!");
    }
  }

  // Desafios e objetivos: soma a partida e avisa o que ficou completo.
  const completos = registrarDesafios({
    venceu: venceu, pares: paresSeus, combo: melhorSerie, tempoSeg: tempoSeg,
    totalPares: tamanho.pares, modo: modo, nivel: nivelId
  });
  completos.forEach(function (texto) {
    linhas.push('<span class="missao">🎯 Desafio completo: ' + texto + '</span>');
  });

  const moedasAntes = moedas;
  moedas += ganho;
  salvar("memoria-moedas", moedas);
  partidasDesdeAnuncio++;

  if (venceu) sons.vitoria();
  else if (!empate) sons.derrota();
  if (ganho > 0) setTimeout(sons.moeda, 700);

  resultadoTitulo.textContent = titulo;
  resultadoDetalhes.innerHTML =
    linhas.map(function (l) { return "<p>" + l + "</p>"; }).join("") +
    '<p class="ganho">+<span id="ganho-num">0</span> moedas</p>' +
    '<p class="total">Total: <b id="total-num">' + moedasAntes + '</b></p>';
  aviso.textContent = "";
  aviso.className = "vez";

  if (venceu && !menosMovimento) {
    cartas.forEach(function (c) {
      c.classList.add("festa");
      setTimeout(function () { c.classList.remove("festa"); }, 1700);
    });
    confete(coresDaSkin().concat(["#7FB069", "#C46A5B"]));
  }

  setTimeout(function () {
    if (id !== partida) return;
    resultado.classList.remove("oculta");
    animarNumero(document.getElementById("ganho-num"), 0, ganho, 900);
    animarNumero(document.getElementById("total-num"), moedasAntes, moedas, 900);
  }, 800);
}

// ---------------------------------------------------------------
// 14) A MÁQUINA: memória e jogadas
// ---------------------------------------------------------------

function memorizar(carta) {
  if (modo !== "cpu") return;
  if (Math.random() > nivel.chanceDeMemorizar) return;

  const posicao = carta.dataset.posicao;
  if (memoria[posicao]) return;

  memoria[posicao] = carta.dataset.simbolo;
  ordemDaMemoria.push(posicao);

  if (ordemDaMemoria.length > nivel.limiteDeMemoria) {
    const maisAntiga = ordemDaMemoria.shift();
    delete memoria[maisAntiga];
  }
}

function esquecer(carta) {
  const posicao = carta.dataset.posicao;
  delete memoria[posicao];
  ordemDaMemoria = ordemDaMemoria.filter(function (p) { return p !== posicao; });
}

function cartasDisponiveis() {
  return cartas.filter(function (c) {
    return !c.classList.contains("encontrada") && !c.classList.contains("virada");
  });
}

function sortearCarta() {
  const livres = cartasDisponiveis();
  if (livres.length === 0) return null;
  const desconhecidas = livres.filter(function (c) { return !memoria[c.dataset.posicao]; });
  const opcoes = desconhecidas.length > 0 ? desconhecidas : livres;
  return opcoes[Math.floor(Math.random() * opcoes.length)];
}

function procurarParNaMemoria() {
  const posicoes = Object.keys(memoria);
  for (let i = 0; i < posicoes.length; i++) {
    for (let j = i + 1; j < posicoes.length; j++) {
      if (memoria[posicoes[i]] === memoria[posicoes[j]]) {
        const a = cartas[posicoes[i]];
        const b = cartas[posicoes[j]];
        if (!a.classList.contains("encontrada") && !b.classList.contains("encontrada")) {
          return [a, b];
        }
      }
    }
  }
  return null;
}

function procurarNaMemoria(simbolo, exceto) {
  const posicao = Object.keys(memoria).find(function (p) {
    return memoria[p] === simbolo && p !== exceto.dataset.posicao;
  });
  return posicao ? cartas[posicao] : null;
}

// Pausa com um pouco de variação, pra máquina não jogar como um relógio.
function pausaDaCpu() {
  return nivel.pausa + Math.round((Math.random() - 0.5) * 260);
}

/* A jogada da máquina. Mesmo quando ela LEMBRA de um par, existe uma
   chance (chanceDeErro) de ela se distrair e virar outra carta. É isso
   que torna o difícil forte, mas ainda humano e batível. */
function turnoDaCpu(id) {
  if (id !== partida || partidaFinalizada) return;

  const parConhecido = procurarParNaMemoria();
  const distraiu = Math.random() < nivel.chanceDeErro;

  if (parConhecido && !distraiu) {
    abrirCarta(parConhecido[0]);
    setTimeout(function () {
      if (id !== partida) return;
      abrirCarta(parConhecido[1]);
    }, pausaDaCpu());
    return;
  }

  const primeira = sortearCarta();
  if (!primeira) return;
  abrirCarta(primeira);

  setTimeout(function () {
    if (id !== partida) return;
    const irma = procurarNaMemoria(primeira.dataset.simbolo, primeira);
    const irmaValida = irma &&
      !irma.classList.contains("virada") &&
      !irma.classList.contains("encontrada");
    const distraiuDeNovo = Math.random() < nivel.chanceDeErro;
    abrirCarta(irmaValida && !distraiuDeNovo ? irma : sortearCarta());
  }, pausaDaCpu());
}
